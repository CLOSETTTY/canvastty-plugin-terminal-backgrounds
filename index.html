<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fine Dots Backgrounds Pack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <div class="header-icon">✦</div>
        <div>
          <h1 class="header-title">Fine Dots Backgrounds</h1>
          <p class="header-subtitle">Коллекция проверенных анимированных фонов Брайль 2×4 для CanvasTTY</p>
        </div>
      </div>
      <div class="header-stats">
        <span class="badge" id="count-badge">20 фонов</span>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Поиск фонов...">
      </div>

      <div class="category-tabs">
        <button class="tab-btn active" data-cat="all">Все · 20</button>
        <button class="tab-btn" data-cat="cyber">Киберпанк</button>
        <button class="tab-btn" data-cat="space">Космос</button>
        <button class="tab-btn" data-cat="retro">Ретро & Пиксели</button>
        <button class="tab-btn" data-cat="memes">Мемы & Котики</button>
      </div>
    </div>

    <main class="gallery-grid" id="gallery-grid">
      <!-- Cards rendered via app.js -->
    </main>

    <div class="toast" id="toast">Задание скопировано! Вставьте его в чат агента CanvasTTY</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
